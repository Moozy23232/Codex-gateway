name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build for inspection only (no Release is published)'
        required: true
        default: '0.2.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select and validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUSHED_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${PUSHED_TAG#v}"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo 'Release tags must point to a commit already on main.' >&2
              exit 1
            }
          else
            version="${REQUESTED_VERSION#v}"
          fi
          source scripts/build.sh
          version="$(normalize_release_version "$version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: bash scripts/check.sh
      - name: Package all supported platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OUTPUT_DIR: ${{ runner.temp }}/release-assets
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-gateway-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    # Manual runs produce downloadable workflow artifacts only.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-gateway-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          release_flags=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "${VERSION%%+*}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          # A draft keeps an incomplete upload out of the public latest endpoint.
          # Existing releases fail here instead of replacing their assets.
          gh release create "$TAG" ./*.tar.gz ./SHA256SUMS ./install.sh \
            --repo "$GITHUB_REPOSITORY" "${release_flags[@]}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
