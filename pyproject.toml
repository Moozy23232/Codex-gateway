[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-gateway"
version = "0.1.0"
description = "A local multi-provider Responses gateway for Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
codex-gateway = "codex_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
